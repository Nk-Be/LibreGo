plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

def akeysFile = file('D:/NkBe/Akeys/LibreGo-key.p12')
def localKeyFile = file('../keystore/LibreGo-key.p12')
def targetKeyFile = akeysFile.exists() ? akeysFile : localKeyFile

android {
    ndkVersion = '26.2.11394342'
    compileSdk = 37
    buildToolsVersion = '37.0.0'
    namespace = 'com.zcshou.gogogo'

    signingConfigs {
        debug {
            storeFile targetKeyFile
            storePassword '1919810'
            keyAlias 'librego'
            keyPassword '1919810'
            storeType 'PKCS12'
        }
        release {
            storeFile targetKeyFile
            storePassword '1919810'
            keyAlias 'librego'
            keyPassword '1919810'
            storeType 'PKCS12'
        }
    }

    defaultConfig {
        applicationId "top.nkbe.libre"
        minSdkVersion 27
        targetSdkVersion 37
        versionCode 2200
        versionName '2.2.0'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        resourceConfigurations += ['zh', 'zh-rCN', 'en', 'en-rUS']
        ndk {
            abiFilters "arm64-v8a"
        }
        signingConfig = signingConfigs.release
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig = signingConfigs.release
            multiDexEnabled = true
        }
        debug {
            signingConfig = signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig = true
        compose = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            excludes += ['lib/armeabi/**']
        }
        resources {
            excludes += ['lib/armeabi/**', 'META-INF/*.version']
        }
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            def outputFile = output.outputFile
            if (outputFile != null && outputFile.name.endsWith('.apk')) {
                def fileName
                if (variant.buildType.name == 'release') {
                    fileName = "LibreGo_${defaultConfig.versionName}_arm64-v8a_release.apk"
                } else {
                    fileName = "LibreGo_${defaultConfig.versionName}_arm64-v8a_debug.apk"
                }
                outputFileName = fileName
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1'
    
    // Jetpack Compose & Material 3
    def composeBom = platform('androidx.compose:compose-bom:2024.09.03')
    implementation composeBom
    androidTestImplementation composeBom
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'

    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.6'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.squareup.okhttp3:okhttp:5.5.1'
    implementation 'com.elvishew:xlog:1.11.1'
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    // OpenStreetMap - 100% public & unrestricted
    implementation 'org.osmdroid:osmdroid-android:6.1.20'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation('androidx.test.espresso:espresso-core:3.7.0', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
}
