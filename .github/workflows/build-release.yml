name: Build Release

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  Build:
    name: Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Get Tag
        id: var
        run: echo "tag=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT

      - name: Create local.properties
        run: |
          MAPS_KEY="${{ secrets.MAPS_API_KEY }}"
          if [ -z "$MAPS_KEY" ]; then MAPS_KEY="fb7YwlKY3ntx8hBDGMGLqX2FhlPkDMvv"; fi
          MAPS_CODE="${{ secrets.MAPS_SAFE_CODE }}"
          if [ -z "$MAPS_CODE" ]; then MAPS_CODE="C7:39:86:A1:EA:2E:AD:D4:B3:CF:63:CA:A4:2B:C6:AC:2B:59:E2:B7;top.nkbe.libre"; fi
          cat << EOF > local.properties
          MAPS_API_KEY=$MAPS_KEY
          MAPS_SAFE_CODE=$MAPS_CODE
          EOF

      - name: Build APK
        run: bash ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LibreGo-Release
          path: app/build/outputs/apk/release/*.apk

      - name: Make Changelog
        uses: ardalanamini/auto-changelog@v4.0.4
        id: changelog
        with:
          github-token: ${{ github.token }}
          commit-types: |
            feat: New Features
            fix: Bug Fixes
            build: Build System & Dependencies
            perf: Performance Improvements
            docs: Documentation
            test: Tests
            refactor: Refactors
            chore: Chores
            ci: CI
            style: Code Style
            revert: Reverts
          default-commit-type: Other Changes
          mention-authors: true
          mention-new-contributors: true
          include-compare-link: true

      - name: Release APK
        uses: softprops/action-gh-release@v3.0.3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          token: ${{ github.token }}
          body: ${{ steps.changelog.outputs.changelog }}
          prerelease: false
          files: app/build/outputs/apk/release/*.apk
